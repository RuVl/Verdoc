repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff-check
        args: [ "--fix" ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests (dev postgres)
        entry: make dev-test
        language: system
        always_run: true
        pass_filenames: false