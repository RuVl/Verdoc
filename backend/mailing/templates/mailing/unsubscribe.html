<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Отписка от рассылки</title>
    <style>
        body { font-family: sans-serif; max-width: 480px; margin: 15vh auto; padding: 0 20px; text-align: center; color: #222; }
        .muted { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    {% if error %}
        <h1>Ссылка недействительна</h1>
        <p class="muted">Ссылка отписки повреждена или устарела.</p>
    {% else %}
        <h1>Вы отписаны</h1>
        <p>Адрес <b>{{ email }}</b> больше не будет получать рассылку.</p>
    {% endif %}
</body>
</html>
