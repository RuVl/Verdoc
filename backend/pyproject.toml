[project]
name = "verdoc-backend"
version = "0.1.0"
description = "Verdoc storefront backend (Django REST + Plisio)"
requires-python = ">=3.13"
dependencies = [
    "django==6.0.6",
    "djangorestframework==3.17.1",
    "django-cors-headers==4.9.0",
    "django-environ==0.14.0",
    "django-modeltranslation==0.20.3",
    "django-money[exchange]==3.5.4",
    "django-tinymce==5.0.0",
    "gunicorn==23.0.0",
    "gevent==25.5.1",
    "pycountry==24.6.1",
    "psycopg[binary]==3.2.9",
    "requests==2.32.4",
    "dnspython>=2.8.0",
]

# === ruff ===
[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv"]
extend-exclude = ["best_db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]

[dependency-groups]
dev = [
    "djangorestframework-stubs>=3.17.1",
]
