[project]
name = "verdoc-backend"
version = "0.1.0"
description = "Verdoc storefront backend (Django REST + Plisio)"
requires-python = ">=3.13"
dependencies = [
    "Django==5.2.4",
    "djangorestframework==3.16.0",
    "django-cors-headers==4.7.0",
    "django-environ==0.12.0",
    "django-modeltranslation==0.19.16",
    "django-money[exchange]==3.5.4",
    "gunicorn==23.0.0",
    "gevent==25.5.1",
    "pycountry==24.6.1",
    "psycopg[binary]==3.2.9",
    "requests==2.32.4",
]

# === ruff ===
[tool.ruff]
target-version = "py313"
line-length = 120
exclude = [".venv"]
extend-exclude = ["best_db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "C4", "SIM"]
