volumes:
  postgres_volume: # Volume for database
    name: verdoc_postgres
  products_volume: # Volume for product files
    name: verdoc_products
  static_volume: # Volume with django static for serving by nginx
    name: verdoc_static

networks:
  verdoc:
    driver: bridge
    name: verdoc
    ipam:
      config:
        - subnet: 172.18.0.0/16 # for postfix and opendkim trust
          gateway: 172.18.0.1

services:
  frontend-nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - static_volume:/usr/src/app/static
    ports:
      - "80:80"
      - "443:443"
    networks:
      - verdoc
    depends_on:
      - backend

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./postgres/backups:/var/backups/postgres
    env_file: postgres/.env
    expose:
      - 5432
    networks:
      - verdoc
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - products_volume:/usr/src/app/products
      - static_volume:/usr/src/app/static
      - ./backend/logs:/usr/src/app/logs
    env_file:
      - backend/.env
      - postgres/.env  # For db connection
    expose:
      - 8000
    networks:
      - verdoc
    extra_hosts:
      host.docker.internal: host-gateway
    depends_on:
      postgres:
        condition: service_healthy
