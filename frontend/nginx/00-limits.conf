# Shared rate-limit zones. Lives in conf.d as a plain config (not a template): the zones belong to
# the http context and must be declared exactly once, while both site templates reference them.
# The 00- prefix keeps it first in nginx's alphabetical include of conf.d/*.conf.

# Checkout. Every unpaid order reserves stock until it expires, so this is the expensive endpoint.
limit_req_zone $binary_remote_addr zone=checkout:10m rate=10r/m;

# Re-sending download links. Each request sends an e-mail, so it is an outbound spam vector.
limit_req_zone $binary_remote_addr zone=maillinks:10m rate=5r/m;

# Token-addressed endpoints: the purchases page and the paid files. Guessing a uuid4 is hopeless
# (122 bits), so this is not what stands between a scanner and somebody's files - it keeps a scan
# out of the log and off the database, where every hit also walks the allocation rows. The burst
# covers the honest worst case: opening the page, refreshing every link and pulling all
# MAX_ORDER_ITEMS files at once.
limit_req_zone $binary_remote_addr zone=tokenscan:10m rate=120r/m;

# The admin login. Nothing else on the box takes a password, and it is reachable from both
# domains, so it must not be a place to try them one after another.
limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;

# 503 reads as "we are broken", 429 as "slow down".
limit_req_status 429;
