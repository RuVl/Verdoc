# Both domains sit behind Cloudflare, so every connection reaches nginx from a Cloudflare edge node.
# Without this file $remote_addr is that node: the limit_req zones in 00-limits.conf would meter a
# whole edge node into one bucket (ten checkouts a minute shared by everyone behind it, while an
# attacker on another node gets a fresh allowance), the access log would name Cloudflare instead of
# the visitor, and Django would be handed the same wrong address through X-Real-IP.
#
# Lives in conf.d as a plain config: these directives belong to the http context, like the zones.
# The list of ranges is Cloudflare's own (https://www.cloudflare.com/ips-v4 and /ips-v6) and has to
# be refreshed when they publish a new one - a range missing here means visitors behind it are
# metered as one client again. Fetched 2026-09-07.
#
# Harmless if Cloudflare is ever taken off: with no set_real_ip_from matching the peer, nginx leaves
# $remote_addr alone, and a forged CF-Connecting-IP from a direct client is ignored for the same
# reason.

# Cloudflare IPv4
set_real_ip_from        173.245.48.0/20;
set_real_ip_from        103.21.244.0/22;
set_real_ip_from        103.22.200.0/22;
set_real_ip_from        103.31.4.0/22;
set_real_ip_from        141.101.64.0/18;
set_real_ip_from        108.162.192.0/18;
set_real_ip_from        190.93.240.0/20;
set_real_ip_from        188.114.96.0/20;
set_real_ip_from        197.234.240.0/22;
set_real_ip_from        198.41.128.0/17;
set_real_ip_from        162.158.0.0/15;
set_real_ip_from        104.16.0.0/13;
set_real_ip_from        104.24.0.0/14;
set_real_ip_from        172.64.0.0/13;
set_real_ip_from        131.0.72.0/22;

# Cloudflare IPv6
set_real_ip_from        2400:cb00::/32;
set_real_ip_from        2606:4700::/32;
set_real_ip_from        2803:f800::/32;
set_real_ip_from        2405:b500::/32;
set_real_ip_from        2405:8100::/32;
set_real_ip_from        2a06:98c0::/29;
set_real_ip_from        2c0f:f248::/32;

# Cloudflare puts the visitor here, one address and never a list, unlike X-Forwarded-For.
real_ip_header          CF-Connecting-IP;
real_ip_recursive       on;
