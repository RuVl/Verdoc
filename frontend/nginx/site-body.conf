# Everything both site templates share: headers, locations, compression, timeouts. Included from
# inside the server block of each, so the only per-domain lines left in the templates are
# listen / server_name / the certificate paths. Anything added here lands on both domains at once,
# which is the point - the two used to be 112 identical lines apart from ${DOMAIN}.

# Default headers
# HSTS
add_header              'Strict-Transport-Security' 'max-age=63072000; includeSubDomains; preload';

# Default settings
http2                   on;
autoindex               off;

# Encoding
charset                 utf-8;
source_charset          utf-8;

set                     $project_home /app/;
root                    /usr/share/nginx/html;
index                   index.html;

# logging
access_log              /usr/www/logs/nginx_access.log;
error_log               /usr/www/logs/nginx_error.log error;

# Checkout: reserves stock, so it is rate limited per client (exact match wins over the regex
# location below). The Plisio callback at /api/order/status stays unlimited on purpose.
location = /api/order/ {
  limit_req             zone=checkout burst=5 nodelay;
  include               /etc/nginx/proxy-backend.conf;
}

# Re-sending download links: one e-mail per request.
location = /api/send-links/ {
  limit_req             zone=maillinks burst=3 nodelay;
  include               /etc/nginx/proxy-backend.conf;
}

# The admin login form: rate limited like the checkout, for the same reason the checkout is -
# a request that costs something must not be free to repeat. The rest of /admin/ is untouched.
location = /admin/login/ {
  limit_req             zone=adminlogin burst=5 nodelay;
  include               /etc/nginx/proxy-backend.conf;
}

# The purchases page and the paid files: both are addressed by a uuid4 alone, so a scanner that
# walks them costs us log lines, queries and allocation lookups. Regex, and above the
# `^/(api|admin)/` catch-all, so these win. See the zone comment for why the burst is this wide.
location ~ ^/api/(purchases|files)/ {
  limit_req             zone=tokenscan burst=40 nodelay;
  include               /etc/nginx/proxy-backend.conf;
}

# Django proxy (admin and api)
location ~ ^/(api|admin)/ {
  include               /etc/nginx/proxy-backend.conf;
}

# Frontend files. Unknown paths fall through to the SPA shell, which is an internal redirect to
# /index.html and so picks up the no-cache of the exact location below - the fallback must never be
# cached under the URL it was requested for.
location / {
  try_files             $uri $uri/ /index.html;
}

# The vite build: the content hash is in the filename, so a new build is a new URL and these are
# safe to cache forever in the browser and in Cloudflare. An add_header here drops the inherited
# ones, so HSTS is repeated - same in every location below that sets a header of its own.
location /assets/ {
  add_header            'Strict-Transport-Security' 'max-age=63072000; includeSubDomains; preload';
  add_header            'Cache-Control' 'public, max-age=31536000, immutable';
}

# The SPA shell. Its name never changes and it names the hashed bundles, so a cached copy pins the
# visitor to the previous build; it must be revalidated on every load.
location = /index.html {
  add_header            'Strict-Transport-Security' 'max-age=63072000; includeSubDomains; preload';
  add_header            'Cache-Control' 'no-cache';
}

# Django's static files
location /static/ {
  alias                 $project_home/static/;
}


# Error pages
error_page 500 502 503 504 /50x.html;
location = /50x.html {
  root                  /usr/share/nginx/html;
}

# Not allowed locations
location ~ /\.(?!well-known).* {
  deny                  all;
  access_log            off;
  log_not_found         off;
}

# Compression settings
gzip                    on;
gzip_vary               on;
gzip_comp_level         6;
gzip_proxied            any;
gzip_disable            "msie6";
gzip_http_version       1.1;
gzip_min_length         1100;
gzip_types              text/plain text/css application/json application/x-javascript text/xml application/xml application/xml+rss text/javascript application/javascript application/vnd.ms-fontobject application/x-font-ttf font/opentype image/svg+xml image/x-icon;

# Send file settings (use up 100mb files)
sendfile                on;
sendfile_max_chunk      2m;
client_max_body_size    100M;

# Connection settings
tcp_nopush              on;
tcp_nodelay             on;
keepalive_timeout       60;
